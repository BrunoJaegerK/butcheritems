# Tiempo en segundos entre cada limpieza (mínimo: 1)
Schedule: 300

# Tipos disponibles: chat, title, actionbar
Announcement: title

# Si está en true, las entidades con nombre personalizado se eliminan.
KillEntitiesWithNametags: true

# Entidades que nunca serán eliminadas.
# Acepta nombres como ZOMBIE, EntityZombie o el nombre completo de la clase.
# Deja la lista vacía para no excluir entidades adicionales.
ExcludedEntities: []

# Mundos en los que ClearLag no realizará ninguna limpieza.
# Los nombres no distinguen entre mayúsculas y minúsculas.
ExcludedWorlds: []

# Segundos restantes en los que se mostrará un anuncio.
# Usa [] para desactivar los anuncios previos.
Announcements:
  - 60
  - 30
  - 15
  - 10
  - 5
  - 4
  - 3
  - 2
  - 1

Commands:
  Clearlag:
    Name: "clearlag"
    Description: "Clear all the lag."
    Permission: "butcheritems.clearlag"
    Usage: "/clearlag"
