name: Build ButcherItems

on:
  push:
    branches:
      - feature/java17-exclusions-holograms
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: ButcherItems-Java17
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
